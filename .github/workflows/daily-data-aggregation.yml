name: Daily data aggregation

on:
  schedule:
    # Every morning at 06:00 UTC = 8:00 (summer) / 7:00 (winter) in Paris, after duels.ink's
    # nightly recompute (~01:30 UTC). GitHub may start scheduled runs a few minutes late.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-data-aggregation
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Collect the weeks (the current one included)
        run: npm run collect

      - name: Commit the data
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "data: collection ($(date -u +%F))"
            git push
          fi

  # The data commit above doesn't trigger Website deploy on its own (pushes made with the
  # workflow token never trigger workflows): call it, building the branch so the new data is in.
  website:
    needs: collect
    uses: ./.github/workflows/website-deploy.yml
    with:
      ref: ${{ github.ref_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
