name: Weekly digest

on:
  schedule:
    # Monday 9:00 in Paris. Crons are UTC, so both 9:00 CEST (07:00 UTC) and 9:00 CET
    # (08:00 UTC) are scheduled and the `gate` job keeps the one matching today's offset.
    # GitHub may start scheduled runs a few minutes late.
    - cron: '0 7 * * 1'
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      post:
        description: Post the digest to Discord
        type: boolean
        default: false

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Paris date +%z)
          case "$EVENT|$CRON|$offset" in
            workflow_dispatch*) run=true ;;
            "schedule|0 7 * * 1|+0200" | "schedule|0 8 * * 1|+0100") run=true ;;
            *) run=false ;;
          esac
          echo "Paris offset $offset, cron '$CRON' → run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Collect finished weeks
        run: npm run collect

      - name: Commit the data
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "data: weekly collection ($(date -u +%F))"
            git push
          fi

      - name: Render the digest images
        run: npm run digest

      - name: Build the page
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: out/digest
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  post:
    needs: [build, deploy]
    # Posts even when GitHub Pages isn't enabled (yet): the message then goes out without a link.
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.post)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: digest
          path: out/digest
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/post-discord.js
