name: Website deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Also called by the daily data aggregation once the morning's data is committed: a push
  # made with the workflow token doesn't trigger other workflows by itself.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (default: the commit that triggered the run)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the page
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One Pages deployment at a time, never cancelled midway (job level, so it also holds when
    # this workflow is called by another one)
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
